########################################
# 基础设置：尽量贴近当前 Codex 的常用默认项
########################################

model = "gpt-5.4"

# model_provider 与 model_providers 由 Aistock 根据当前服务商自动写入
# 如需手动指定可自行在此添加:
# model_provider = "YourProviderName"

# 推理强度
model_reasoning_effort = "high"

# 本地响应存储策略
disable_response_storage = true

# 沙箱模式
# 默认保留 danger-full-access，符合当前 Aistock 用户习惯
sandbox_mode = "danger-full-access"
windows_wsl_setup_acknowledged = true

# 命令审批策略（只影响本地行为，不会影响上游服务商）
approval_policy = "never"

# 默认 profile 只改本地执行行为，不改模型或服务商
profile = "auto-max"

# 打开文件用哪个编辑器
file_opener = "vscode"


########################################
# 历史记录 & 终端 UI（纯本地）
########################################

[history]
persistence = "save-all"

[tui]
notifications = true


########################################
# Shell 环境（纯本地）
########################################

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
# 如有需要可以再加 exclude / include_only / set


########################################
# workspace-write 沙箱设置（纯本地）
########################################

[sandbox_workspace_write]
network_access = true
# 可按需再加 writable_roots / exclude_tmpdir_env_var / exclude_slash_tmp


########################################
# Features：只保留当前仍然常用且未废弃的项
########################################

[features]
multi_agent = true
# 其余 feature 建议跟随 Codex 内建默认值，避免把过时开关写死


########################################
# Profiles：只改“行为”，不改模型/提供方
########################################

[profiles.auto-max]
approval_policy = "never"
sandbox_mode = "danger-full-access"

[profiles.review]
# 审核模式：命令前多问一句（适合公司仓库）
approval_policy = "on-request"
sandbox_mode = "workspace-write"

